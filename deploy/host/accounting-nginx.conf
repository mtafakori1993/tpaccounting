# Admin-installed in /etc/gitlab/tpaccounting-nginx.conf, with a symlink in
# /var/opt/gitlab/nginx/conf/service_conf/tpaccounting.conf (Omnibus includes *.conf).
# Deliberately bound only to the WireGuard address. No public Traefik ingress.
server {
    listen 10.20.0.1:80;
    server_name accounting.tafakorpardazan.ir;
    server_tokens off;
    allow 10.20.0.0/24;
    deny all;
    location / {
        return 301 https://accounting.tafakorpardazan.ir$request_uri;
    }
}

server {
    listen 10.20.0.1:443 ssl;
    server_name accounting.tafakorpardazan.ir;
    server_tokens off;
    allow 10.20.0.0/24;
    deny all;

    ssl_certificate /etc/letsencrypt/live/accounting.tafakorpardazan.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounting.tafakorpardazan.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 25m;
    access_log /var/log/gitlab/nginx/tpaccounting_access.log gitlab_access;
    error_log /var/log/gitlab/nginx/tpaccounting_error.log;

    # Resolve the Service dynamically through k3s CoreDNS, including after a
    # Service recreation. The host's system DNS does not resolve cluster.local.
    resolver 10.43.0.10 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $accounting_backend app.tpaccounting.svc.cluster.local:8085;

    location / {
        proxy_pass http://$accounting_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A single trusted proxy: replace client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        # Omnibus enables a global proxy cache; accounting responses must never
        # inherit it (authenticated financial data and sessions are private).
        proxy_cache off;
    }
}
