apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tpaccounting
  labels: {app: tpaccounting, component: postgres, managed-by: gitlab-ci}
spec:
  clusterIP: None
  selector: {app: tpaccounting, component: postgres}
  ports: [{name: postgres, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tpaccounting
  labels: {app: tpaccounting, component: postgres, managed-by: gitlab-ci}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: tpaccounting, component: postgres}
  template:
    metadata:
      labels: {app: tpaccounting, component: postgres}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: tpaccounting}
            - {name: POSTGRES_DB, value: tpaccounting}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: TZ, value: Asia/Tehran}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: tpaccounting-secrets, key: DB_PASSWORD}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            exec: {command: [pg_isready, -U, tpaccounting, -d, tpaccounting]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -U, tpaccounting, -d, tpaccounting]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, tpaccounting, -d, tpaccounting]}
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
