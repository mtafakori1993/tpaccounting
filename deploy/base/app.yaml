apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: attachments
  namespace: tpaccounting
  labels: {app: tpaccounting, managed-by: gitlab-ci}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: tpaccounting
  labels: {app: tpaccounting, component: app, managed-by: gitlab-ci}
spec:
  selector: {app: tpaccounting, component: app}
  ports: [{name: http, port: 8085, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: tpaccounting
  labels: {app: tpaccounting, component: app, managed-by: gitlab-ci}
spec:
  replicas: 1   # attachments live on a ReadWriteOnce volume: keep a single replica
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: tpaccounting, component: app}
  template:
    metadata:
      labels: {app: tpaccounting, component: app}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: gitlab-registry}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: tpaccounting
          ports: [{name: http, containerPort: 8085}]
          envFrom:
            - configMapRef: {name: tpaccounting-config}
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: tpaccounting-secrets, key: DB_PASSWORD}}
            - name: SESSION_SECRET
              valueFrom: {secretKeyRef: {name: tpaccounting-secrets, key: SESSION_SECRET}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - {name: attachments, mountPath: /data/attachments}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: attachments
          persistentVolumeClaim: {claimName: attachments}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
