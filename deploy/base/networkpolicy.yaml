apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: tpaccounting}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# VPN-only entry: the GitLab nginx on the host (10.20.0.1) proxies to the app Service; host-to-pod
# traffic arrives from the node's cni0 address. There is deliberately NO Traefik/public ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-host-nginx-to-app, namespace: tpaccounting}
spec:
  podSelector: {matchLabels: {app: tpaccounting, component: app}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 10.42.0.1/32}
      ports: [{protocol: TCP, port: 8085}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-postgres-from-app, namespace: tpaccounting}
spec:
  podSelector: {matchLabels: {app: tpaccounting, component: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: tpaccounting, component: app}}
        - podSelector: {matchLabels: {app: tpaccounting, component: backup}}
      ports: [{protocol: TCP, port: 5432}]
