name: tpaccounting

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tpaccounting}
      POSTGRES_USER: ${DB_USER:-tpaccounting}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  app:
    build:
      context: .
      # Host networking lets the build use a local HTTP proxy if one is configured;
      # proxy variables are predefined build args and are not stored in the image.
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: tpaccounting:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: ${APP_PORT:-8085}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tpaccounting}
      DB_USER: ${DB_USER:-tpaccounting}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_SSLMODE: disable
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      STORAGE_DIR: /data/attachments
      TZ: ${TZ:-Asia/Tehran}
      # Tafakor AI add-on (optional): e.g. http://tafakor-ai:8090; empty = disabled.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8085}:${APP_PORT:-8085}"
    volumes:
      - attachments:/data/attachments
    networks: [internal]

volumes:
  pgdata:
  attachments:

networks:
  internal:
